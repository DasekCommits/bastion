name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e . pytest
      - name: Tests
        run: pytest -q
      - name: Balance check
        run: python -m bastion check-balance --games 300 --tolerance 0.1
