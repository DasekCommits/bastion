<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bastion · Office demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root { --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --body: "Space Grotesk", system-ui, sans-serif; }
body[data-side="blue"] {
  --wall: #cfd8e3; --wall2: #b9c5d3; --floor: #8a97aa; --desk: #7a5a42; --desk2: #5d4331; --accent: #2f6fde;
  --hood: #262f44; --hood2: #1c2335; --skin: #e7b48f; --glow: #9cc8ff; --chair: #303846;
}
body[data-side="red"] {
  --wall: #1b1622; --wall2: #141019; --floor: #0f0c14; --desk: #2a2532; --desk2: #1d1923; --accent: #ff2e63;
  --hood: #34313f; --hood2: #262430; --skin: #d9a07c; --glow: #ff8fb0; --chair: #0a0a0d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(var(--wall) 0 55%, var(--floor) 55%); color: #eee; font-family: var(--body); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; border: 0; cursor: pointer;
  background: rgba(10,10,14,.72); color: #fff; backdrop-filter: blur(6px); }
.pill.on { background: var(--accent); }
.clockchip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 8px; border-radius: 999px; background: rgba(10,10,14,.78); color: #fff; backdrop-filter: blur(6px); }
.clockchip i { font-style: normal; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: #ffd27a; color: #5a3a00; font-size: 14px; transition: background .6s, color .6s; }
.clockchip.night i { background: #26305a; color: #e8eefc; }
.clockchip small { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.clockchip b { font: 700 17px var(--mono); letter-spacing: .04em; min-width: 52px; }
.clockchip.os { background: rgba(255,255,255,.08); padding: 3px 10px 3px 4px; }
.clockchip.os i { width: 20px; height: 20px; font-size: 12px; }
.clockchip.os b { font-size: 15px; }
.pill[hidden], .lid[hidden] { display: none; }
.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; font: 600 13px var(--mono); padding: 10px 16px; border-radius: 999px;
  background: rgba(10,10,14,.75); color: #fff; animation: bob 2s ease-in-out infinite; white-space: nowrap; }
@keyframes bob { 50% { transform: translate(-50%, -6px); } }

/* scene parts */
.wall { fill: var(--wall); transition: fill .8s; }
.wall2 { fill: var(--wall2); transition: fill .8s; }
.floor { fill: var(--floor); transition: fill .8s; }
.desk { fill: var(--desk); } .desk2 { fill: var(--desk2); }
.hood { fill: var(--hood); transition: fill 1s; } .hood2 { fill: var(--hood2); transition: fill 1s; }
.arm { transition: stroke 1s; }
.hoodup { transition: transform .9s cubic-bezier(.5,0,.2,1), opacity .5s .35s; transform-box: fill-box; transform-origin: 50% 100%; }
body[data-side="blue"] .hoodup { transform: translateY(70px) scaleY(.25); opacity: 0; }
.bare, .suitbits { opacity: 0; transition: opacity .6s .45s; }
body[data-side="blue"] .bare, body[data-side="blue"] .suitbits { opacity: 1; } .skin { fill: var(--skin); } .chair { fill: var(--chair); }
.lit { fill: #ffd27a; transition: opacity 1.2s; }
#laptop { cursor: pointer; }
#laptop:hover .screen-glow, #laptop:focus .screen-glow { opacity: .95; }
#laptop:focus { outline: none; }
.screen-glow { fill: var(--glow); opacity: .55; filter: blur(18px); transition: opacity .3s; }
.arm { animation: type .28s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 0%; }
.arm.r { animation-delay: .14s; }
@keyframes type { to { transform: translateY(4px); } }
.head { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes breathe { 50% { transform: translateY(2px) rotate(-1deg); } }
.steam path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 4; stroke-linecap: round; animation: steam 3s ease-in infinite; }
.steam path:nth-child(2) { animation-delay: 1s; } .steam path:nth-child(3) { animation-delay: 2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
#phone { cursor: pointer; }
#phone.ring { animation: ring .12s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 100% { transform: rotate(-6deg); } }
.waves circle { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
#phone.ring + .waves circle { animation: wave 1s ease-out infinite; }
#phone.ring + .waves circle:nth-child(2) { animation-delay: .35s; }
@keyframes wave { 0% { opacity: .9; r: 10; } 100% { opacity: 0; r: 46; } }
.rain line { stroke: rgba(190,210,255,.55); stroke-width: 2; animation: rain .7s linear infinite; }
@keyframes rain { from { transform: translate(0, -60px); } to { transform: translate(-14px, 360px); } }
.tv-node { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.35); } }
.neon { fill: none; stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 8px var(--accent)); animation: flicker 6s infinite; }
@keyframes flicker { 0%, 19%, 21%, 60%, 62%, 100% { opacity: 1; } 20%, 61% { opacity: .35; } }
.code-line { animation: scroll 3s linear infinite; }
@keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-60px); } }
#doorPanel, #doorBits { transition: transform .6s cubic-bezier(.5,0,.2,1); transform-box: view-box; transform-origin: 1584px 0; }
#door.open #doorPanel, #door.open #doorBits { transform: scaleX(.14); }
#visitor { transition: opacity .5s, transform .9s cubic-bezier(.3,0,.2,1); transform: translateX(50px); }
#door.in #visitor { opacity: 1; transform: translateX(-70px); }
#door.knock #doorPanel { animation: knock .12s 4; }
@keyframes knock { 50% { transform: translateX(2px); } }
#ticker, #redNews { transition: opacity .4s; }
#tickerText { animation: tick 9s linear infinite; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-720px); } }
.board { cursor: pointer; }
.board:hover { filter: brightness(1.08); }
.only-red, .only-blue { display: none; }
.led { animation: led 1.6s steps(2, jump-none) infinite; }
@keyframes led { 50% { opacity: .25; } }
body[data-side="red"] .only-red, body[data-side="blue"] .only-blue { display: inline; }

/* toast */
.toast { position: fixed; top: 64px; left: 50%; z-index: 30; transform: translate(-50%, -140%); max-width: min(92vw, 440px); padding: 14px 18px; border-radius: 10px;
  background: #121018; color: #fff; border: 2px solid var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,.5); font: 14px/1.45 var(--body);
  transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s; opacity: 0; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast b { display: block; font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }

/* laptop OS */
.os { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; opacity: 0; transition: opacity .35s;
  background: radial-gradient(120% 90% at 30% 10%, #24324d, #0d1220 70%); }
body[data-side="red"] .os { background: radial-gradient(120% 90% at 70% 10%, #3a1020, #0a070c 70%); }
.os.open { display: flex; } .os.in { opacity: 1; }
.os::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--heat, 0) * 220px) calc(var(--heat, 0) * 40px) rgba(255, 40, 60, .55); transition: box-shadow .6s; }
.os.hot::after { animation: hot 1.4s ease-in-out infinite; }
@keyframes hot { 50% { opacity: .55; } }
.bar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: rgba(0,0,0,.45); font: 600 12px var(--mono); z-index: 2; flex-wrap: wrap; }
.bar .grow { flex: 1; }
.heat { display: inline-flex; align-items: center; gap: 8px; }
.heat .meter { width: 90px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.heat .meter span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, #ff2e63); transition: width .6s; }
.lid { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; font: 600 12px var(--mono); cursor: pointer; }
.desk-area { position: relative; flex: 1; overflow: hidden; }
.desk-area::before { content: "BASTION"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 clamp(60px, 14vw, 200px)/1 var(--body);
  letter-spacing: .08em; color: rgba(255,255,255,.035); pointer-events: none; white-space: nowrap; }
.desk-area::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; }
.dock { display: flex; justify-content: center; gap: 10px; padding: 10px 14px; z-index: 2; margin: 0 auto 10px; width: fit-content; border-radius: 20px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.dock button { width: 58px; height: 58px; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  display: grid; place-items: center; font-size: 24px; transition: transform .2s cubic-bezier(.2,1.6,.4,1), background .2s; position: relative; }
.dock button small { position: absolute; bottom: -2px; font: 600 9px var(--mono); opacity: .8; }
.dock button:hover { transform: translateY(-8px) scale(1.12); background: rgba(255,255,255,.16); }
.dock button.active::after { content: ""; position: absolute; bottom: -7px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.win { position: absolute; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #0f1117; border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 24px 60px rgba(0,0,0,.55); animation: pop .32s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85) translateY(30px); opacity: 0; } }
.win.closing { animation: shut .2s ease-in forwards; }
@keyframes shut { to { transform: scale(.9) translateY(20px); opacity: 0; } }
.win header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(rgba(255,255,255,.09), rgba(255,255,255,.04)); font: 600 12px var(--mono); cursor: grab; user-select: none; border-bottom: 1px solid rgba(255,255,255,.08); }
.win header .dots { display: flex; gap: 6px; margin-right: 6px; }
.win header .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ffbd2e; display: block; } .win header .dots i:last-child { background: #28c840; }
.win header .x { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; border: 0; cursor: pointer; padding: 0; order: -1; }
.win header .ttl { margin: 0 auto; transform: translateX(-30px); opacity: .85; }
.win:focus-within, .win.top { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.win .body { flex: 1; overflow: auto; padding: 12px; font: 13px/1.55 var(--mono); }
.term { color: #d7ffe0; background: #07090c; }
.term .p { color: var(--accent); }
.term .dim { color: #7c8a96; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08); background: #0b0d12; }
.cmd { font: 600 12px var(--mono); padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; }
.cmd:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.cmd:disabled { opacity: .35; cursor: not-allowed; }
.dice { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.dice .track { position: relative; flex: 1; max-width: 260px; height: 14px; border-radius: 4px; background: #1c222b; overflow: hidden; }
.dice .zone { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(60, 220, 130, .35); }
.dice .needle { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; box-shadow: 0 0 8px #fff; left: 0; }
.dice b { font-size: 13px; min-width: 42px; }
.stamp { display: inline-block; margin: 6px 0 10px; padding: 4px 12px; border: 3px solid; border-radius: 6px; font: 800 18px var(--mono); letter-spacing: .1em;
  transform: rotate(-4deg); animation: stamp .35s cubic-bezier(.2,1.8,.4,1); }
.stamp.ok { color: #3ddc84; border-color: #3ddc84; } .stamp.bad { color: #ff4d6d; border-color: #ff4d6d; } .stamp.warn { color: #ffb347; border-color: #ffb347; }
@keyframes stamp { from { transform: scale(2.6) rotate(-14deg); opacity: 0; } }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, -1px); } }
.flash { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: #fff; opacity: 0; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { 10% { opacity: .55; } 100% { opacity: 0; } }
.netmap { background: #0b1018; }
.netmap svg { width: 100%; height: 100%; display: block; }
.link { stroke: rgba(255,255,255,.18); stroke-width: 2; }
.node rect, .node circle { fill: #1b2433; stroke: rgba(255,255,255,.35); stroke-width: 2; transition: fill .5s, stroke .5s; }
.node text { fill: #c9d4e4; font: 11px var(--mono); text-anchor: middle; }
.node.owned rect, .node.owned circle { fill: #5a1324; stroke: #ff4d6d; }
.node.scanned rect { stroke: #ffd27a; stroke-dasharray: 5 4; }
.node.cut rect { fill: #222; stroke: #666; }
.packet { filter: drop-shadow(0 0 6px currentColor); }
.ripple { fill: none; stroke: #ffd27a; stroke-width: 2; }
.logs { background: #0a0e14; }
.log { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; animation: slide .35s ease-out; }
@keyframes slide { from { transform: translateX(-20px); opacity: 0; } }
.log.sus { background: rgba(255, 77, 109, .12); animation: slide .35s ease-out, blink 1.2s ease-in-out 3; }
@keyframes blink { 50% { background: rgba(255, 77, 109, .35); } }
.log .t { color: #7c8a96; }
.log button { font: 600 11px var(--mono); padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer; }
.log button:hover { background: var(--accent); }
.mail { background: #f4f1ec; color: #1b1a1e; font-family: var(--body); }
.mail .item { padding: 10px 12px; border-bottom: 1px solid #ddd6cc; cursor: pointer; }
.mail .item:hover { background: #ebe5dc; }
.mail .item b { display: block; }
.mail .item span { color: #6b6460; font-size: 13px; }
.mail .msg { padding: 4px 2px; }
.mail .msg .from { font: 12px var(--mono); color: #6b6460; }
.mail .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.mail .btns button { font: 600 13px var(--body); padding: 8px 12px; border-radius: 8px; border: 2px solid #1b1a1e; background: #fff; cursor: pointer; }
.mail .btns button:hover { background: #1b1a1e; color: #fff; }
.daycard { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; pointer-events: none; opacity: 0; background: rgba(5,5,10,.85); }
.daycard.go { animation: daycard 2.6s ease-in-out; }
@keyframes daycard { 0% { opacity: 0; } 20%, 75% { opacity: 1; } 100% { opacity: 0; } }
.daycard div { font: 700 clamp(40px, 9vw, 96px)/1 var(--body); letter-spacing: .04em; text-align: center; }
.daycard small { display: block; font: 600 14px var(--mono); letter-spacing: .2em; opacity: .7; margin-top: 12px; }
.panel { position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: .3s cubic-bezier(.2,1.4,.4,1);
  width: min(92vw, 420px); background: #fffdf5; color: #222; border-radius: 6px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); font-family: var(--body); }
.panel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.panel h3 { margin: 0 0 12px; }
.panel .q { display: grid; gap: 4px; padding: 10px 0; border-top: 1px dashed #ccc; font-size: 14px; }
.panel .q .m { height: 6px; border-radius: 99px; background: #eee; overflow: hidden; } .panel .q .m span { display: block; height: 100%; background: #222; }
.panel { z-index: 45; }
.panel .choices { display: grid; gap: 8px; margin-top: 14px; }
.panel .choices button { font: 600 14px var(--body); padding: 11px 14px; border-radius: 10px; border: 2px solid #222; background: #fff; cursor: pointer; text-align: left; transition: transform .15s, background .15s; }
.panel .choices button:hover { background: #222; color: #fff; transform: translateX(4px); }
.panel .close { margin-top: 12px; font: 600 13px var(--body); padding: 8px 14px; border-radius: 8px; border: 2px solid #222; background: #fff; cursor: pointer; }
.end { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(5,5,10,.82); backdrop-filter: blur(4px); }
.end.show { display: grid; animation: fadein .4s; }
@keyframes fadein { from { opacity: 0; } }
.end-card { width: min(92vw, 440px); padding: 26px; border-radius: 14px; background: #111018; border: 2px solid var(--accent); text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.6); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.end-title { font: 700 clamp(44px, 10vw, 72px)/1 var(--body); letter-spacing: .08em; color: var(--accent); text-shadow: 0 0 24px var(--accent); }
.end.lost .end-title { color: #9aa3ad; text-shadow: 2px 0 #ff2e63, -2px 0 #08f7fe; animation: glitch 1.2s steps(2) infinite; }
@keyframes glitch { 20% { transform: translate(2px, -1px); } 40% { transform: translate(-2px, 1px); } 60% { transform: none; } }
.end-card p { color: #c9c4cf; margin: 12px 0 18px; }
.end-rows { display: grid; gap: 6px; text-align: left; font: 14px var(--mono); }
.end-rows div, .end-total { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.05); }
.end-total { margin: 12px 0 18px; font: 700 20px var(--mono); background: rgba(255,255,255,.1); }
.conf { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }
.bubble { position: fixed; z-index: 46; width: min(360px, calc(100vw - 24px)); padding: 16px 18px; border-radius: 18px; background: #fffdf5; color: #1b1a1e;
  box-shadow: 0 18px 50px rgba(0,0,0,.45); font: 16px/1.45 var(--body); opacity: 0; transform: scale(.7) translateY(10px); transform-origin: right center; pointer-events: none;
  transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); }
.bubble.show { opacity: 1; transform: none; pointer-events: auto; }
.bubble::after { content: ""; position: absolute; right: -12px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-left: 14px solid #fffdf5; border-right: 0; }
.bubble.below::after { display: none; }
.bubble b { display: block; font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #8a8290; margin-bottom: 4px; }
.bubble .said { margin: 0; min-height: 1.4em; font-size: 17px; }
.bubble .choices { display: grid; gap: 8px; margin-top: 12px; }
.bubble .choices:empty { display: none; }
.bubble .choices button { font: 600 14px var(--body); padding: 10px 14px; border-radius: 12px; border: 2px solid #1b1a1e; background: #fff; cursor: pointer; text-align: left;
  animation: pop .3s cubic-bezier(.2,1.4,.4,1) backwards; transition: background .15s, color .15s, transform .15s; }
.bubble .choices button:nth-child(2) { animation-delay: .08s; }
.bubble .choices button:hover { background: #1b1a1e; color: #fff; transform: translateX(-4px); }
.menu { position: fixed; inset: 0; z-index: 55; overflow-y: auto; background: radial-gradient(120% 90% at 50% 0%, rgba(20,16,28,.72), rgba(5,5,10,.94) 70%); backdrop-filter: blur(5px);
  transition: opacity .5s; }
.menu.hide { opacity: 0; pointer-events: none; }
.menu-inner { width: min(1060px, 100%); margin: 0 auto; padding: 40px 16px 60px; display: grid; gap: 26px; }
.menu-logo { margin: 0; text-align: center; font: 700 clamp(56px, 12vw, 120px)/1 var(--body); letter-spacing: .1em; color: transparent; -webkit-text-stroke: 2px var(--accent);
  text-shadow: 0 0 30px color-mix(in srgb, var(--accent) 60%, transparent); animation: flicker 7s infinite; }
.menu h2 { margin: 0 0 10px; font: 700 18px var(--body); letter-spacing: .04em; color: #fff; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

  background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.14); transition: transform .2s cubic-bezier(.2,1.6,.4,1), border-color .2s, background .2s, box-shadow .2s; font-family: var(--body); }

.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: 0 0 0 1px var(--accent), 0 14px 40px color-mix(in srgb, var(--accent) 30%, transparent); }

.start { font: 700 20px var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 16px 56px; border-radius: 999px; border: 0; cursor: pointer; color: #fff;

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const svg = $("#scene");
  const S = { night: false, rain: false, side: "red", day: 1, minutes: 9 * 60, heat: 0, coins: 0, inside: false, admin: false, scanned: false, stolen: false, cut: false,
    sound: false, zoomed: false, quests: { scout: 0, inside: 0, climb: 0 }, wins: [] };
  const MAPS = {
    olive: { name: "Olive Byte", domain: "olivebyte", web: "web-01", db: "db-01", pc: "office-pc", webName: "web shop", people: 5, machines: 4, days: 3, size: "Small" },
    clinic: { name: "Harbor Clinic", domain: "harborclinic", web: "site", db: "ehr", pc: "front-desk", webName: "patient portal", people: 10, machines: 7, days: 4, size: "Medium" },
    bank: { name: "Meridian Bank", domain: "meridianbank", web: "online-banking", db: "core", pc: "branch", webName: "online banking site", people: 20, machines: 12, days: 5, size: "Large" },
  };
  const LEVELS = { easy: { p: .12, atk: .8, night: 1, spot: .7 }, medium: { p: 0, atk: 1, night: 2, spot: 1 }, hard: { p: -.08, atk: 1.2, night: 3, spot: 1.25 } };
  let M = MAPS.olive, L = LEVELS.medium;
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const FULL = [0, 0, 1600, 900], SCREEN = [684, 384, 272, 168], PORTRAIT = [300, 60, 1000, 820];
  let vb = FULL.slice();

  /* sound */
  let ac = null;
  function beep(f = 660, d = .06, type = "square", vol = .04) {
    if (!S.sound) return;
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol; o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.start(); o.stop(ac.currentTime + d);
  }
  $("#sound").onclick = () => { S.soundChosen = true; S.sound = !S.sound; if (!S.sound) window.speechSynthesis?.cancel(); $("#sound").textContent = S.sound ? "Sound on" : "Sound off"; $("#sound").classList.toggle("on", S.sound); beep(880); ambience(); };
  $("#music").onclick = () => { S.music = !S.music; $("#music").textContent = S.music ? "Music on" : "Music off"; $("#music").classList.toggle("on", S.music); music(); };
  function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
  let noiseBuf = null;
  function noise() {
    const a = audio(); if (noiseBuf) return noiseBuf;
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return noiseBuf;
  }
  function click() {
    if (!S.sound) return; const a = audio(), src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noise(); f.type = "highpass"; f.frequency.value = 2500 + Math.random() * 1500; g.gain.value = .12;
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .03); src.connect(f); f.connect(g); g.connect(a.destination); src.start(); src.stop(a.currentTime + .04);
  }
  function alarm() {
    if (!S.sound) return; const a = audio(), o = a.createOscillator(), g = a.createGain(); o.type = "square"; g.gain.value = .035;
    for (let i = 0; i < 6; i++) o.frequency.setValueAtTime(i % 2 ? 620 : 880, a.currentTime + i * .18);
    g.gain.setValueAtTime(.035, a.currentTime + 1.0); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 1.1);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 1.12);
  }
  let rainNode = null;
  function ambience() {
    const want = S.sound && S.night && S.rain;
    if (want && !rainNode) {
      const a = audio(), src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = noise(); src.loop = true; f.type = "lowpass"; f.frequency.value = 1100; g.gain.value = 0; g.gain.linearRampToValueAtTime(.06, a.currentTime + 2);
      src.connect(f); f.connect(g); g.connect(a.destination); src.start(); rainNode = { src, g };
    } else if (!want && rainNode) {
      const a = audio(), n = rainNode; rainNode = null; n.g.gain.linearRampToValueAtTime(0, a.currentTime + 1.5); setTimeout(() => n.src.stop(), 1600);
    }
  }
  let musicTimer = null, step = 0;
  function music() {
    clearInterval(musicTimer); musicTimer = null; if (!S.music) return;
    const a = audio(), out = a.createGain(); out.gain.value = .05; out.connect(a.destination);
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.connect(out);
    const note = (f, t, len, type, vol = 1) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + len); o.connect(g); g.connect(lp); o.start(t); o.stop(t + len + .05); };
    musicTimer = setInterval(() => {
      if (!S.music) return; const t = a.currentTime + .05;
      if (S.side === "red") {
        const seq = S.night ? [110, 130.8, 164.8, 196, 164.8, 130.8] : [110, 130.8, 164.8, 220, 196, 164.8, 130.8, 146.8];
        note(seq[step % seq.length] * 2, t, .35, "sawtooth", .5); if (step % 8 === 0) note(55, t, 2.2, "triangle", .9);
      } else {
        const chords = [[261.6, 329.6, 392, 493.9], [220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [196, 246.9, 293.7, 349.2]];
        if (step % 8 === 0) chords[(step / 8) % 4].forEach((f) => note(f, t, 3.6, "sine", .35));
        if (step % 2 === 0) note(chords[Math.floor(step / 8) % 4][(step / 2) % 4] * 2, t, .5, "triangle", .2);
      }
      step++;
    }, 280);
  }

  /* window, lights, rain, time of day */
  const lights = $("#lights");
  [[1010, 300, 60, 130], [1075, 260, 48, 170], [1128, 320, 70, 110], [1205, 240, 56, 190], [1266, 300, 64, 130], [1335, 275, 45, 155], [1385, 330, 50, 100]].forEach(([bx, by, bw, bh]) => {
    for (let y = by + 10; y < by + bh - 12; y += 18) for (let x = bx + 8; x < bx + bw - 10; x += 14) {
      if (Math.random() < .45) continue;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 6); r.setAttribute("height", 8); r.setAttribute("class", "lit"); r.style.opacity = 0; lights.appendChild(r);
    }
  });
  const rain = $("#rain");
  for (let i = 0; i < 40; i++) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    const x = 1010 + Math.random() * 440, y = 100 + Math.random() * 300;
    l.setAttribute("x1", x); l.setAttribute("y1", y); l.setAttribute("x2", x - 6); l.setAttribute("y2", y + 22);
    l.style.animationDelay = (-Math.random()).toFixed(2) + "s"; rain.appendChild(l);
  }
  const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  const SKY = [[0, "#070a1c", "#141a3a"], [5, "#070a1c", "#141a3a"], [6.2, "#3b2f6b", "#ff9a7a"], [7.5, "#7fb2ff", "#ffd7a8"],
    [16, "#7fb2ff", "#ffe4c4"], [18, "#ff8a5c", "#ffcf8a"], [19.3, "#3b2f6b", "#c46a7a"], [20.5, "#0b1030", "#1d2350"], [24, "#070a1c", "#141a3a"]];
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
      if (h >= h0 && h <= h1) { const k = (h - h0) / (h1 - h0); return [mix(t0, t1, k), mix(b0, b1, k)]; }
    }
    return [SKY[0][1], SKY[0][2]];
  }
  const stars = $("#stars");
  for (let i = 0; i < 40; i++) stars.insertAdjacentHTML("beforeend", `<circle cx="${1012 + Math.random() * 416}" cy="${132 + Math.random() * 150}" r="${(Math.random() * 1.4 + .4).toFixed(1)}" opacity="${(Math.random() * .6 + .4).toFixed(2)}"/>`);
  const arc = (t) => [1020 + t * 400, 420 - Math.sin(t * Math.PI) * 240];
  function paintTime() {
    const h = (S.minutes / 60) % 24;
    const [top, bottom] = skyAt(h);
    $("#sky1").setAttribute("stop-color", top); $("#sky2").setAttribute("stop-color", bottom);
    const night = h >= 20.5 || h < 5 ? 1 : h >= 18 ? (h - 18) / 2.5 : h < 7 ? 1 - (h - 5) / 2 : 0;
    const ts = (h - 6) / 14, sunUp = ts > -0.05 && ts < 1.05;
    const [sx, sy] = arc(Math.min(1, Math.max(0, ts)));
    ["#sun", "#sunglow"].forEach((id) => { $(id).setAttribute("cx", sx.toFixed(1)); $(id).setAttribute("cy", sy.toFixed(1)); $(id).style.opacity = sunUp ? "" : 0; });
    $("#sun").setAttribute("fill", h > 17 || h < 7.5 ? "#ffb070" : "#fff3c4");
    const tm = ((h - 19 + 24) % 24) / 12, moonUp = tm >= 0 && tm <= 1;
    const [mx, my] = arc(Math.min(1, tm));
    $("#moon").setAttribute("transform", `translate(${mx.toFixed(1)} ${my.toFixed(1)})`);
    $("#moon").setAttribute("opacity", moonUp ? Math.min(1, night * 1.4).toFixed(2) : 0);
    stars.setAttribute("opacity", (night * .9).toFixed(2));
    lights.querySelectorAll("rect").forEach((r, i) => { r.style.opacity = Math.min(1, night * 1.5) * (i % 3 ? 1 : .4); });
    $("#rain").setAttribute("opacity", S.rain && night > .5 ? 1 : 0);
    $("#dark").setAttribute("opacity", (night * (S.side === "red" ? .25 : .45)).toFixed(2));
    const day = Math.floor(S.minutes) % (24 * 60), mm = Math.floor(day % 60), hh = Math.floor(day / 60);
    $("#mhand").setAttribute("transform", `rotate(${(day % 60) * 6})`);
    $("#hhand").setAttribute("transform", `rotate(${(hh % 12) * 30 + (day % 60) / 2})`);
    const time = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`, dark = night > .5;
    document.querySelectorAll(".clockchip").forEach((c) => { c.classList.toggle("night", dark);
      c.querySelector("i").textContent = dark ? "☾" : "☀"; c.querySelector("small").textContent = `${S.night ? "Night" : "Day"} ${S.day}`; c.querySelector("b").textContent = time; });
  }

  /* little laptop screen in the office view */
  function paintMini() {
    const g = $("#minisc"); g.innerHTML = "";
    const lines = S.side === "red" ? ["> recon", "> exploit", "> escalate", "> exfil", "heat " + Math.round(S.heat * 100) + "%"]
      : ["09:12 login ok", "09:14 dns query", "09:15 FAILED login", "09:16 mail in", "09:17 port probe"];
    lines.concat(lines).forEach((t, i) => {
      const x = document.createElementNS("http://www.w3.org/2000/svg", "text");
      x.setAttribute("x", 694); x.setAttribute("y", 404 + i * 18); x.setAttribute("class", "code-line");
      x.setAttribute("fill", S.side === "red" ? "#3ddc84" : (t.includes("FAILED") || t.includes("probe") ? "#ff6b81" : "#9cc8ff"));
      x.setAttribute("font-family", "JetBrains Mono"); x.setAttribute("font-size", "12"); x.textContent = t; g.appendChild(x);
    });
  }
  function paintNotes() {
    const g = $("#notes"); g.innerHTML = "";
    const colors = S.side === "red" ? ["#ffe36e", "#ff9fb2", "#a6f0c6"] : ["#ffe36e", "#a8d4ff", "#c8f7a6"];
    const items = S.side === "red" ? ["Scout", "Get in", "Climb"] : ["Logs", "Block", "Cut off"];
    items.forEach((t, i) => {
      const x = 140 + i * 115, y = 200 + (i % 2) * 40;
      g.insertAdjacentHTML("beforeend", `<g transform="translate(${x} ${y}) rotate(${(i - 1) * 4})"><rect width="96" height="86" fill="${colors[i]}"/>
        <text x="10" y="30" font-family="Space Grotesk" font-weight="700" font-size="17" fill="#222">${t}</text>
        <text x="10" y="64" font-family="JetBrains Mono" font-size="13" fill="#444">${questText(i)}</text></g>`);
    });
  }
  const questText = (i) => S.side === "red" ? [`${S.quests.scout}/1`, `${S.quests.inside}/3`, `${S.quests.climb}/3`][i] : ["0/3", "0/3", "0/3"][i];

  /* side switch */
  function setSide(side) {
    S.side = side; document.body.dataset.side = side;
    $("#osSide").textContent = side === "red" ? "OPERATOR · RED" : "ANALYST · BLUE";
    paintMini(); paintNotes(); paintTime(); buildDock();
    if (S.zoomed) { $("#deskArea").innerHTML = ""; openApp(side === "red" ? "term" : "logs"); }
  }
  const CFG = { side: "red", map: "olive", level: "medium" };
  function paintMenu() {
    document.querySelectorAll(".opts").forEach((g) => g.querySelectorAll(".opt[data-v]").forEach((o) => o.classList.toggle("on", CFG[g.dataset.group] === o.dataset.v)));
  }
  document.querySelectorAll(".opts").forEach((g) => g.addEventListener("click", (e) => {
    const o = e.target.closest(".opt[data-v]"); if (!o) return;
    CFG[g.dataset.group] = o.dataset.v; beep(700, .05);
    if (g.dataset.group === "side") { S.side = o.dataset.v; document.body.dataset.side = o.dataset.v; }
    paintMenu();
  }));
  function openMenu() { S.paused = true; $("#resumeBtn").hidden = !S.started || S.over; $("#menu").classList.remove("hide"); paintMenu(); }
  function startGame() {
    M = MAPS[CFG.map]; L = LEVELS[CFG.level]; S.started = true; S.paused = false;
    if (!S.soundChosen) { S.sound = true; $("#sound").textContent = "Sound on"; $("#sound").classList.add("on"); audio(); }
    $("#tvName").textContent = `SOC · ${M.name.toUpperCase()}`;
    $("#menu").classList.add("hide"); beep(520, .1, "triangle"); setTimeout(() => beep(780, .14, "triangle"), 120);
    resetGame(CFG.side); $("#hint").style.display = "";
  }
  $("#startBtn").onclick = startGame;
  $("#resumeBtn").onclick = () => { $("#menu").classList.add("hide"); S.paused = false; };
  $("#menuBtn").onclick = () => { if (S.zoomed) closeLaptop(); openMenu(); };

  /* camera zoom into the laptop */
  function fitPortrait() {
    if (S.zoomed) return;
    const portrait = innerHeight > innerWidth;
    svg.setAttribute("preserveAspectRatio", portrait ? "xMidYMid meet" : "xMidYMid slice");
    vb = portrait ? PORTRAIT.slice() : FULL.slice(); svg.setAttribute("viewBox", vb.join(" "));
  }
  addEventListener("resize", fitPortrait);
  function animateBox(to, ms) {
    return new Promise((done) => {
      if (reduce) { vb = to.slice(); svg.setAttribute("viewBox", vb.join(" ")); return done(); }
      const from = vb.slice(), t0 = performance.now();
      const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      (function step(now) {
        const t = Math.min(1, (now - t0) / ms), e = ease(t);
        vb = from.map((v, i) => v + (to[i] - v) * e); svg.setAttribute("viewBox", vb.join(" "));
        t < 1 ? requestAnimationFrame(step) : done();
      })(t0);
    });
  }
  async function openLaptop(instant) {
    if (S.zoomed) return;
    S.zoomed = true; $("#hint").style.display = "none"; beep(520, .1, "sine");
    if (instant === true) { vb = SCREEN.slice(); svg.setAttribute("viewBox", vb.join(" ")); } else await animateBox(SCREEN, 1100);
    const os = $("#os"); os.classList.add("open"); os.setAttribute("aria-hidden", "false");
    requestAnimationFrame(() => os.classList.add("in"));
    if (!$("#deskArea").children.length) { openApp("map"); openApp(S.side === "red" ? "term" : "logs"); }
    beep(780, .12, "sine");
  }
  async function closeLaptop() {
    const os = $("#os"); os.classList.remove("in"); os.setAttribute("aria-hidden", "true");
    await new Promise((r) => setTimeout(r, reduce ? 0 : 300)); os.classList.remove("open");
    paintMini(); await animateBox(innerHeight > innerWidth ? PORTRAIT : FULL, 900); S.zoomed = false;
  }
  $("#laptop").addEventListener("click", openLaptop);
  $("#laptop").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") openLaptop(); });
  $("#lid").onclick = closeLaptop;
  addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#panel").classList.contains("show")) { if (!eventOpen) hidePanel(); } else if (S.zoomed) closeLaptop(); } });

  /* office props */
  function toast(title, text, ms = 3200) {
    const t = $("#toast"); t.innerHTML = `<b>${title}</b>${text}`; t.classList.add("show"); beep(990, .08, "triangle");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), ms);
  }
  const calls = { red: ["Your contact: “Their IT guy is on holiday this week. Move fast.”", "Unknown number: “We know what you are doing.” Click."],
    blue: ["CEO: “Are we safe? I need a short report by 17:00.”", "Maria from finance: “I got a strange invoice email. Should I open it?”"] };
  function ringPhone() {
    if (S.zoomed) return;
    $("#phone").classList.add("ring");
    if (S.sound) { [0, 300, 600].forEach((d) => setTimeout(() => beep(1200, .12, "sine", .05), d)); }
  }
  $("#phone").addEventListener("click", () => {
    if (!$("#phone").classList.contains("ring")) { toast("Phone", "No calls right now."); return; }
    $("#phone").classList.remove("ring");
    const list = calls[S.side]; toast("Incoming call", list[Math.floor(Math.random() * list.length)], 5200);

      else { S.blue.disruption++; toast("Machine isolated", `${M.web} was clean. The ${M.webName} is down until tomorrow.`); }
    }
    await spend(20);
    if (S.blue.kicks >= 2) endGame(true, "You kicked the attacker out twice. They gave up.");
  }
  function attackerStep() {
    const a = S.atk;
    if (S.night) {
      if (a.nightSteps >= L.night) { a.next = Infinity; return; }
      a.nightSteps++; a.next = S.minutes + 250 + Math.random() * 150;
    } else a.next = S.minutes + 45 + Math.random() * 60;
    if (a.blockedUntil > S.minutes) return;
    if (S.cut && a.stage >= 1 && a.stage <= 3) { a.stage = 1; }
    const st = STAGES[a.stage];
    if (S.cut && a.stage === 1) { addLog({ text: `${st.text(a.ip)} (no answer, ${M.web} is offline)` }); return; }
    if (a.free && a.stage <= 1) {
      a.free = false; addLog({ text: `login from an unusual country · maria · mail`, sus: true, real: true, stage: 1, ok: true, ip: a.ip });
      packet(["you", "mail"], "#ff4d6d", true); a.stage = 2; return;
    }
    const chance = Math.min(.95, a.stage === 1 && S.patched ? .15 : st.chance * L.atk * (S.night ? 1.2 : 1));
    const ok = Math.random() < chance;
    addLog({ text: st.text(a.ip), sus: true, real: true, stage: a.stage, ok, ip: a.ip });
    packet(st.path, "#ff4d6d", ok);
    if (ok) a.stage++;
    if (a.stage >= 4) endGame(false, "The attacker copied the customer database and left.");
  }
  function blueTick() {
    if (S.side !== "blue" || S.over) return;
    if (S.nextNoise == null || S.nextNoise > S.minutes + 400) S.nextNoise = S.minutes + 10;
    if (S.nextDecoy == null || S.nextDecoy > S.minutes + 600) S.nextDecoy = S.minutes + 120 + Math.random() * 80;
    if (S.minutes >= S.nextNoise) { addLog({ text: pick(NOISE()) }); S.nextNoise = S.minutes + (S.night ? 120 + Math.random() * 120 : 15 + Math.random() * 15); }
    if (!S.night && S.minutes >= S.nextDecoy) { addLog({ text: pick(DECOYS()), sus: true, real: false }); S.nextDecoy = S.minutes + 120 + Math.random() * 80; }
    if (S.minutes >= S.atk.next) attackerStep();
  }

  /* end of a game */
  function endGame(won, why) {
    if (S.over) return; S.over = true;
    const red = S.side === "red";
    const rows = red
      ? [["Got inside", S.quests.inside ? 5 : 0], ["Became admin", S.admin || S.stolen ? 5 : 0], ["Data taken", S.stolen ? 25 : 0], ["Heat left", Math.round((1 - S.heat) * 10)], ["Office decisions", S.bonus || 0]]
      : [["Attacks confirmed", S.blue.confirmed * 2], ["Addresses blocked", S.blue.blocks * 2], ["Kicked out", S.blue.kicks * 8], ["Data safe", won ? 20 : 0], ["Clean machines hit", -S.blue.disruption * 3], ["Office decisions", S.bonus || 0]];
    const total = rows.reduce((t, r) => t + r[1], 0);
    const end = $("#end");
    end.className = "end show " + (won ? "won" : "lost");
    end.innerHTML = `<div class="end-card"><div class="end-title">${won ? "VICTORY" : "DEFEAT"}</div><p>${why}</p>
      <div class="end-rows">${rows.map(([k, v]) => `<div><span>${k}</span><b data-v="${v}">0</b></div>`).join("")}</div>
      <div class="end-total"><span>Score</span><b id="endTotal">0</b></div>
      <button class="pill on" id="again">Play again</button></div>`;
    $("#again").onclick = () => { $("#end").className = "end"; openMenu(); };
    beep(won ? 660 : 140, .5, won ? "triangle" : "sawtooth", .06);
    if (won) confetti(); else shake();
    const cells = [...end.querySelectorAll(".end-rows b")]; let i = 0;
    (function next() {
      if (i >= cells.length) { countUp($("#endTotal"), total); return; }
      countUp(cells[i++], +cells[i - 1].dataset.v); setTimeout(next, reduce ? 0 : 380);
    })();
  }
  function countUp(el, to) {
    const t0 = performance.now(), ms = reduce ? 1 : 500;
    (function step(now) { const t = Math.min(1, (now - t0) / ms); el.textContent = Math.round(to * t); beep(900 + t * 500, .015, "sine", .02); if (t < 1) requestAnimationFrame(step); })(t0);
  }
  function confetti() {
    if (reduce) return;
    const colors = ["#ff2e63", "#08f7fe", "#ffd27a", "#3ddc84", "#7a3fc0"];
    for (let i = 0; i < 120; i++) {
      const p = document.createElement("i"); p.className = "conf";
      p.style.left = Math.random() * 100 + "vw"; p.style.background = colors[i % colors.length];
      p.style.animationDuration = (2 + Math.random() * 2.5) + "s"; p.style.animationDelay = Math.random() * .6 + "s";
      p.style.setProperty("--dx", (Math.random() * 200 - 100) + "px"); p.style.setProperty("--r", (Math.random() * 720) + "deg");
      document.body.appendChild(p); setTimeout(() => p.remove(), 5500);
    }
  }

  /* mail */
  function initMail(w) {
    const b = w.querySelector(".body");
    if (S.side === "blue") {
      const mails = [["Invoice #2231 overdue", "billing@b-packaging.example", "Please pay today or your account will be closed. Password for the zip: 1234.", true],
        ["Lunch on Friday?", `jacob@${M.domain}.example`, "Pizza place again? Reply by Thursday.", false],
        ["Your mailbox is almost full", "it-support@0livebyte.example", "Click here and sign in to keep your emails.", true]];
      const list = () => { b.innerHTML = mails.map((m, i) => `<div class="item" data-i="${i}"><b>${m[0]}</b><span>${m[1]}</span></div>`).join("");
        b.querySelectorAll(".item").forEach((x) => x.onclick = () => open(+x.dataset.i)); };
      const open = (i) => { const m = mails[i];
        b.innerHTML = `<div class="msg"><div class="from">from ${m[1]}</div><h3>${m[0]}</h3><p>${m[2]}</p><div class="btns"><button data-v="1">Report phishing</button><button data-v="0">It's fine</button><button data-v="back">Back</button></div><div class="res"></div></div>`;
        b.querySelectorAll("button").forEach((x) => x.onclick = () => {
          if (x.dataset.v === "back") return list();
          const right = (x.dataset.v === "1") === m[3];
          b.querySelector(".res").innerHTML = `<span class="stamp ${right ? "ok" : "bad"}">${right ? "GOOD CALL" : "WRONG"}</span><p>${m[3] ? "Lookalike sender and pressure to act fast: classic phishing." : "A normal email from a colleague."}</p>`;
          if (!right) shake(); else flash();
        }); };
      list();
    } else {
      b.innerHTML = `<div class="msg"><div class="from">draft · to maria@${M.domain}.example</div><h3>Pick a story</h3><p>Which email would Maria (finance) open?</p>
        <div class="btns"><button data-c=".5">Unpaid invoice</button><button data-c=".2">You won a prize</button><button data-c=".35">IT: reset your password</button></div><div class="res"></div></div>`;
      b.querySelectorAll("button").forEach((x) => x.onclick = async () => {
        b.querySelectorAll("button").forEach((y) => y.disabled = true);
        const res = b.querySelector(".res"); res.innerHTML = `<p>sending… chance ${Math.round(+x.dataset.c * (S.night ? 40 : 100))}%${S.night ? " (night: nobody reads email)" : ""}</p>`;
        await packet(["you", "mail"], "#ff4d6d", true);
        const ok = Math.random() < +x.dataset.c * (S.night ? .4 : 1); setHeat(S.heat + .06);
        res.innerHTML += `<span class="stamp ${ok ? "ok" : "bad"}">${ok ? "CLICKED" : "IGNORED"}</span><p>${ok ? "Maria opened it. You have her account." : "She deleted it. Maybe a story that fits her job?"}</p>`;
        if (!ok) shake(); else { flash(); S.quests.inside++; paintNotes(); }
        await spend(60); setTimeout(() => initMail(w), 2600);
      });
    }
  }

  /* office events: someone knocks, the news, the boss */
  const EVENTS = () => ({
    blue: [
      { kind: "news", who: "SOC TV", title: "Breaking news", ticker: `BREAKING: serious flaw found in popular ${M.webName} software · patch now ·`,
        text: `A serious flaw in the ${M.webName} software you run is all over the news.`,
        options: [["Patch now (shop offline 1 hour)", async () => { S.patched = true; S.bonus = (S.bonus || 0) + 2; await spend(60); toast("Patched", "Web exploits against the shop will mostly fail now."); }],
                  ["Patch next week", () => toast("Noted", "The flaw stays open for now.")]] },
      { kind: "door", who: "Maria · Finance", voice: { pitch: 1.35, rate: 1.05, female: true }, look: ["#7a4b8c", "#5a3a2a", null], title: "Knock knock",
        text: "“I typed my password into a page from an email. Is that bad?”",
        options: [["Reset her password now (20 min)", async () => { S.bonus = (S.bonus || 0) + 3; await spend(20); toast("Good call", "Her old password is useless now."); }],
                  ["Don't worry about it", () => { S.atk.free = true; toast("Hmm", "Maria goes back to her desk, relieved."); }]] },
      { kind: "door", who: "The CEO", voice: { pitch: .75, rate: .95 }, look: ["#4b5563", "#2b2b2b", "#c62828"], title: "The boss walks in",
        text: "“I need a short status report. Now.”",
        options: [["Write the report (45 min)", async () => { S.bonus = (S.bonus || 0) + 4; await spend(45); toast("Report sent", "The CEO trusts the SOC a bit more."); }],
                  ["Not now, I'm busy", () => { S.bonus = (S.bonus || 0) - 3; toast("Ouch", "The CEO leaves. Not happy."); }]] },
    ],
    red: [
      { kind: "news", who: "Second screen", title: "New intel",
        text: `${M.name} just posted that their only IT admin is on holiday this week.`,
        options: [["Strike today (+15% to every move)", () => { S.boost = true; toast("Go", "Nobody is minding the shop today."); }],
                  ["Wait", () => toast("Patience", "Maybe a better chance will come.")]] },
      { kind: "door", who: "Your partner", voice: { pitch: .9, rate: 1.1 }, look: ["#1f1f26", "#111", null], title: "Knock knock",
        text: `“Found leaked passwords for ${M.name} on a forum. Three coins and they're yours.”`,
        options: [["Buy them (◈ 3)", () => { if (S.coins < 3) { toast("No money", "You don't have three coins yet."); return; } S.coins -= 3; $("#osCoins").textContent = "◈ " + S.coins; S.leak = true; toast("Bought", "Web exploits got easier."); }],
                  ["No thanks", () => toast("Suit yourself", "Your partner shrugs and leaves.")]] },
    ],
  });
  function scheduleEvent() { S.nextEvent = S.minutes + 70 + Math.random() * 90; }
  let eventOpen = false;
  async function officeEvent() {
    const force = new URLSearchParams(location.search).get("event");
    const pool = EVENTS()[S.side].filter((e) => !S.seen?.includes(e.title) && (force !== "door" || e.kind === "door")); if (!pool.length) return;
    const ev = pool[Math.floor(Math.random() * pool.length)]; S.seen = [...(S.seen || []), ev.title];
    eventOpen = true; S.paused = true;
    if (ev.kind === "door") {
      const [body, hair, tie] = ev.look; $("#vBody").setAttribute("fill", body); $("#vHair").setAttribute("fill", hair);
      $("#vTie").style.display = tie ? "" : "none"; if (tie) $("#vTie").setAttribute("fill", tie);
      const door = $("#door"); door.classList.add("knock"); knock();
      await sleep(900); door.classList.remove("knock");
      if (S.zoomed) { await sleep(300); knock(); await closeLaptop(); await sleep(250); }
      door.classList.add("open"); beep(240, .25, "sine", .03); await sleep(350); door.classList.add("in"); await sleep(900);
      return talk(ev);
    } else {
      $(S.side === "blue" ? "#ticker" : "#redNews").setAttribute("opacity", 1);
      if (ev.ticker) $("#tickerText").textContent = ev.ticker + " " + ev.ticker;
      beep(1046, .12, "triangle"); setTimeout(() => beep(1318, .16, "triangle"), 140);
    }
    showPanel(`<h3>${ev.title}</h3><p style="margin:0 0 6px;color:#666;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em">${ev.who}</p><p>${ev.text}</p>
      <div class="choices">${ev.options.map(([label], i) => `<button data-o="${i}">${label}</button>`).join("")}</div>`, true);
    $("#panel").querySelectorAll("[data-o]").forEach((btn) => btn.onclick = async () => {
      hidePanel(); S.paused = false; eventOpen = false;
      await ev.options[+btn.dataset.o][1]();
      const door = $("#door"); door.classList.remove("in"); await sleep(500); door.classList.remove("open");
      $("#ticker").setAttribute("opacity", 0); $("#redNews").setAttribute("opacity", 0);
    });
  }

  function knock() {
    if (!S.sound) return; const a = audio();
    [0, .2, .4].forEach((t) => {
      const at = a.currentTime + t, o = a.createOscillator(), g = a.createGain(), src = a.createBufferSource(), f = a.createBiquadFilter(), g2 = a.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(140, at); o.frequency.exponentialRampToValueAtTime(60, at + .12);
      g.gain.setValueAtTime(.5, at); g.gain.exponentialRampToValueAtTime(.001, at + .16); o.connect(g); g.connect(a.destination); o.start(at); o.stop(at + .18);
      src.buffer = noise(); f.type = "lowpass"; f.frequency.value = 500; g2.gain.setValueAtTime(.35, at); g2.gain.exponentialRampToValueAtTime(.001, at + .07);
      src.connect(f); f.connect(g2); g2.connect(a.destination); src.start(at); src.stop(at + .08);
    });
  }
  function voiceFor(v = {}) {
    const list = speechSynthesis.getVoices().filter((x) => /^en/i.test(x.lang)); if (!list.length) return null;
    const girl = list.find((x) => /female|zira|samantha|susan|hazel|jenny|aria|google uk english female/i.test(x.name));
    const guy = list.find((x) => /male|david|mark|daniel|george|guy|google uk english male/i.test(x.name) && !/female/i.test(x.name));
    return (v.female ? girl : guy) || list[0];
  }
  function say(text, v = {}) {
    if (!S.sound || !("speechSynthesis" in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[“”"]/g, "")); const voice = voiceFor(v);
    if (voice) u.voice = voice; u.lang = "en-US"; u.pitch = v.pitch || 1; u.rate = v.rate || 1; u.volume = .9;
    speechSynthesis.speak(u); return true;
  }
  function placeBubble() {
    const b = $("#bubble"); if (!b.classList.contains("show")) return;
    const p = svg.createSVGPoint(); p.x = 1450; p.y = 420; const r = p.matrixTransform(svg.getScreenCTM());
    const w = b.offsetWidth, left = Math.max(12, Math.min(innerWidth - w - 12, r.x - w - 18)), top = Math.max(60, Math.min(innerHeight - b.offsetHeight - 12, r.y - b.offsetHeight / 2));
    b.style.left = left + "px"; b.style.top = top + "px"; b.classList.toggle("below", r.x - w - 18 < 12);
  }
  addEventListener("resize", placeBubble);
  async function talk(ev) {
    const b = $("#bubble"), line = ev.text.replace(/^“|”$/g, "");
    b.innerHTML = `<b>${ev.who}</b><p class="said"></p><div class="choices"></div>`; b.classList.add("show"); placeBubble();
    const said = b.querySelector(".said"), spoke = say(line, ev.voice);
    for (const ch of line) {
      said.textContent += ch; placeBubble();
      if (!spoke && /[a-z]/i.test(ch) && Math.random() < .5) beep(320 * (ev.voice?.pitch || 1) + Math.random() * 120, .04, "triangle", .03);
      await sleep(ch === "." || ch === "?" ? 220 : 32);
    }
    const box = b.querySelector(".choices");
    box.innerHTML = ev.options.map(([label], i) => `<button data-o="${i}">${label}</button>`).join(""); placeBubble();
    box.querySelectorAll("[data-o]").forEach((btn) => btn.onclick = async () => {
      window.speechSynthesis?.cancel(); b.classList.remove("show"); S.paused = false; eventOpen = false;
      await ev.options[+btn.dataset.o][1]();
      const door = $("#door"); await sleep(400); door.classList.remove("in"); await sleep(600); door.classList.remove("open");
    });
  }

  function resetGame(side) {
    $("#bubble").classList.remove("show"); $("#door").classList.remove("in", "open");
    Object.assign(S, { night: false, rain: false, day: 1, minutes: 9 * 60, inside: false, admin: false, scanned: false, stolen: false, cut: false, pivot: false,
      quests: { scout: 0, inside: 0, climb: 0 }, logs: [], over: false, suspect: false, bonus: 0, patched: false, leak: false, boost: false, seen: [], paused: false, nightAlerts: 0 });
    S.atk = { stage: 0, ip: newIp(), next: 9 * 60 + 40, blockedUntil: 0 };
    S.blue = { blocks: 0, kicks: 0, disruption: 0, confirmed: 0 };
    scheduleEvent(); hidePanel(); eventOpen = false;
    $("#end").className = "end"; $("#skip").hidden = true; $("#skip2").hidden = true; setHeat(0);
    $("#deskArea").innerHTML = ""; hooks.clear();
    history.replaceState(null, "", location.pathname);
    setSide(side); mapState(); ambience();
  }

  /* server rack LEDs (red room) */
  const rack = $("#rack");
  for (let r = 0; r < 8; r++) {
    const y = 20 + r * 46;
    rack.insertAdjacentHTML("beforeend", `<rect x="14" y="${y}" width="152" height="36" rx="3" fill="#1c1c24"/><rect x="24" y="${y + 14}" width="60" height="6" rx="3" fill="#2a2a33"/>`);
    for (let k = 0; k < 4; k++) {
      const c = ["#3ddc84", "#08f7fe", "#ff2e63", "#3ddc84"][(r + k) % 4];
      rack.insertAdjacentHTML("beforeend", `<circle class="led" cx="${110 + k * 14}" cy="${y + 18}" r="3.5" fill="${c}" style="animation-delay:${(Math.random() * 1.6).toFixed(2)}s;animation-duration:${(0.8 + Math.random() * 1.6).toFixed(2)}s"/>`);
    }
  }

  /* start */
  scheduleEvent(); requestAnimationFrame((t) => { last = t; tick(t); });
  const q = new URLSearchParams(location.search);
  setSide(q.get("side") === "blue" ? "blue" : "red"); setHeat(0); fitPortrait();
  CFG.side = S.side;
  if (q.has("side") || q.has("open") || q.has("t") || q.has("event") || q.has("play")) { $("#menu").classList.add("hide"); S.started = true; }
  else { $("#hint").style.display = "none"; openMenu(); }
  if (q.has("open")) openLaptop(q.get("open") === "now");
  if (q.has("event")) { S.nextEvent = S.minutes + 1; }
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
  if (q.has("t")) { S.minutes = +q.get("t") * 60; if (S.minutes >= 18 * 60 || S.minutes < 9 * 60) { S.night = true; S.rain = q.has("rain"); if (S.minutes < 9 * 60) S.minutes += 24 * 60; $("#skip").hidden = false; } paintTime(); }
})();
</script>
</body>
</html>
