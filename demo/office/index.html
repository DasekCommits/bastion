<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bastion · Office demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root { --mono: "JetBrains Mono", ui-monospace, Consolas, monospace; --body: "Space Grotesk", system-ui, sans-serif; }
body[data-side="blue"] {
  --wall: #cfd8e3; --wall2: #b9c5d3; --floor: #8a97aa; --desk: #7a5a42; --desk2: #5d4331; --accent: #2f6fde;
  --hood: #2d4f8a; --hood2: #223d6b; --skin: #e7b48f; --glow: #9cc8ff; --chair: #303846;
}
body[data-side="red"] {
  --wall: #1b1622; --wall2: #141019; --floor: #0f0c14; --desk: #2a2532; --desk2: #1d1923; --accent: #ff2e63;
  --hood: #34313f; --hood2: #262430; --skin: #d9a07c; --glow: #ff8fb0; --chair: #0a0a0d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(var(--wall) 0 55%, var(--floor) 55%); color: #eee; font-family: var(--body); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; border: 0; cursor: pointer;
  background: rgba(10,10,14,.72); color: #fff; backdrop-filter: blur(6px); }
.pill.on { background: var(--accent); }
.pill[hidden], .lid[hidden] { display: none; }
.hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; font: 600 13px var(--mono); padding: 10px 16px; border-radius: 999px;
  background: rgba(10,10,14,.75); color: #fff; animation: bob 2s ease-in-out infinite; white-space: nowrap; }
@keyframes bob { 50% { transform: translate(-50%, -6px); } }

/* scene parts */
.wall { fill: var(--wall); transition: fill .8s; }
.wall2 { fill: var(--wall2); transition: fill .8s; }
.floor { fill: var(--floor); transition: fill .8s; }
.desk { fill: var(--desk); } .desk2 { fill: var(--desk2); }
.hood { fill: var(--hood); } .hood2 { fill: var(--hood2); } .skin { fill: var(--skin); } .chair { fill: var(--chair); }
.lit { fill: #ffd27a; transition: opacity 1.2s; }
#laptop { cursor: pointer; }
#laptop:hover .screen-glow, #laptop:focus .screen-glow { opacity: .95; }
#laptop:focus { outline: none; }
.screen-glow { fill: var(--glow); opacity: .55; filter: blur(18px); transition: opacity .3s; }
.arm { animation: type .28s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 0%; }
.arm.r { animation-delay: .14s; }
@keyframes type { to { transform: translateY(4px); } }
.head { animation: breathe 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes breathe { 50% { transform: translateY(2px) rotate(-1deg); } }
.steam path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 4; stroke-linecap: round; animation: steam 3s ease-in infinite; }
.steam path:nth-child(2) { animation-delay: 1s; } .steam path:nth-child(3) { animation-delay: 2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
#phone { cursor: pointer; }
#phone.ring { animation: ring .12s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 100% { transform: rotate(-6deg); } }
.waves circle { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
#phone.ring + .waves circle { animation: wave 1s ease-out infinite; }
#phone.ring + .waves circle:nth-child(2) { animation-delay: .35s; }
@keyframes wave { 0% { opacity: .9; r: 10; } 100% { opacity: 0; r: 46; } }
.rain line { stroke: rgba(190,210,255,.55); stroke-width: 2; animation: rain .7s linear infinite; }
@keyframes rain { from { transform: translate(0, -60px); } to { transform: translate(-14px, 360px); } }
.tv-node { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.35); } }
.neon { fill: none; stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 8px var(--accent)); animation: flicker 6s infinite; }
@keyframes flicker { 0%, 19%, 21%, 60%, 62%, 100% { opacity: 1; } 20%, 61% { opacity: .35; } }
.code-line { animation: scroll 3s linear infinite; }
@keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-60px); } }
.board { cursor: pointer; }
.board:hover { filter: brightness(1.08); }
.only-red, .only-blue { display: none; }
.led { animation: led 1.6s steps(2, jump-none) infinite; }
@keyframes led { 50% { opacity: .25; } }
body[data-side="red"] .only-red, body[data-side="blue"] .only-blue { display: inline; }

/* toast */
.toast { position: fixed; top: 64px; left: 50%; z-index: 30; transform: translate(-50%, -140%); max-width: min(92vw, 440px); padding: 14px 18px; border-radius: 10px;
  background: #121018; color: #fff; border: 2px solid var(--accent); box-shadow: 0 12px 40px rgba(0,0,0,.5); font: 14px/1.45 var(--body);
  transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s; opacity: 0; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast b { display: block; font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }

/* laptop OS */
.os { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; opacity: 0; transition: opacity .35s;
  background: radial-gradient(120% 90% at 30% 10%, #24324d, #0d1220 70%); }
body[data-side="red"] .os { background: radial-gradient(120% 90% at 70% 10%, #3a1020, #0a070c 70%); }
.os.open { display: flex; } .os.in { opacity: 1; }
.os::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--heat, 0) * 220px) calc(var(--heat, 0) * 40px) rgba(255, 40, 60, .55); transition: box-shadow .6s; }
.os.hot::after { animation: hot 1.4s ease-in-out infinite; }
@keyframes hot { 50% { opacity: .55; } }
.bar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: rgba(0,0,0,.45); font: 600 12px var(--mono); z-index: 2; flex-wrap: wrap; }
.bar .grow { flex: 1; }
.heat { display: inline-flex; align-items: center; gap: 8px; }
.heat .meter { width: 90px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.heat .meter span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, #ff2e63); transition: width .6s; }
.lid { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; font: 600 12px var(--mono); cursor: pointer; }
.desk-area { position: relative; flex: 1; overflow: hidden; }
.desk-area::before { content: "BASTION"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 700 clamp(60px, 14vw, 200px)/1 var(--body);
  letter-spacing: .08em; color: rgba(255,255,255,.035); pointer-events: none; white-space: nowrap; }
.desk-area::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 40px 40px; }
.dock { display: flex; justify-content: center; gap: 10px; padding: 10px 14px; z-index: 2; margin: 0 auto 10px; width: fit-content; border-radius: 20px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.dock button { width: 58px; height: 58px; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #fff; cursor: pointer;
  display: grid; place-items: center; font-size: 24px; transition: transform .2s cubic-bezier(.2,1.6,.4,1), background .2s; position: relative; }
.dock button small { position: absolute; bottom: -2px; font: 600 9px var(--mono); opacity: .8; }
.dock button:hover { transform: translateY(-8px) scale(1.12); background: rgba(255,255,255,.16); }
.dock button.active::after { content: ""; position: absolute; bottom: -7px; width: 5px; height: 5px; border-radius: 50%; background: #fff; }
.win { position: absolute; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #0f1117; border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 24px 60px rgba(0,0,0,.55); animation: pop .32s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85) translateY(30px); opacity: 0; } }
.win.closing { animation: shut .2s ease-in forwards; }
@keyframes shut { to { transform: scale(.9) translateY(20px); opacity: 0; } }
.win header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(rgba(255,255,255,.09), rgba(255,255,255,.04)); font: 600 12px var(--mono); cursor: grab; user-select: none; border-bottom: 1px solid rgba(255,255,255,.08); }
.win header .dots { display: flex; gap: 6px; margin-right: 6px; }
.win header .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ffbd2e; display: block; } .win header .dots i:last-child { background: #28c840; }
.win header .x { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; border: 0; cursor: pointer; padding: 0; order: -1; }
.win header .ttl { margin: 0 auto; transform: translateX(-30px); opacity: .85; }
.win:focus-within, .win.top { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.win .body { flex: 1; overflow: auto; padding: 12px; font: 13px/1.55 var(--mono); }
.term { color: #d7ffe0; background: #07090c; }
.term .p { color: var(--accent); }
.term .dim { color: #7c8a96; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08); background: #0b0d12; }
.cmd { font: 600 12px var(--mono); padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; }
.cmd:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
.cmd:disabled { opacity: .35; cursor: not-allowed; }
.dice { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.dice .track { position: relative; flex: 1; max-width: 260px; height: 14px; border-radius: 4px; background: #1c222b; overflow: hidden; }
.dice .zone { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(60, 220, 130, .35); }
.dice .needle { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; box-shadow: 0 0 8px #fff; left: 0; }
.dice b { font-size: 13px; min-width: 42px; }
.stamp { display: inline-block; margin: 6px 0 10px; padding: 4px 12px; border: 3px solid; border-radius: 6px; font: 800 18px var(--mono); letter-spacing: .1em;
  transform: rotate(-4deg); animation: stamp .35s cubic-bezier(.2,1.8,.4,1); }
.stamp.ok { color: #3ddc84; border-color: #3ddc84; } .stamp.bad { color: #ff4d6d; border-color: #ff4d6d; } .stamp.warn { color: #ffb347; border-color: #ffb347; }
@keyframes stamp { from { transform: scale(2.6) rotate(-14deg); opacity: 0; } }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(3px, -1px); } }
.flash { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: #fff; opacity: 0; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { 10% { opacity: .55; } 100% { opacity: 0; } }
.netmap { background: #0b1018; }
.netmap svg { width: 100%; height: 100%; display: block; }
.link { stroke: rgba(255,255,255,.18); stroke-width: 2; }
.node rect, .node circle { fill: #1b2433; stroke: rgba(255,255,255,.35); stroke-width: 2; transition: fill .5s, stroke .5s; }
.node text { fill: #c9d4e4; font: 11px var(--mono); text-anchor: middle; }
.node.owned rect, .node.owned circle { fill: #5a1324; stroke: #ff4d6d; }
.node.scanned rect { stroke: #ffd27a; stroke-dasharray: 5 4; }
.node.cut rect { fill: #222; stroke: #666; }
.packet { filter: drop-shadow(0 0 6px currentColor); }
.ripple { fill: none; stroke: #ffd27a; stroke-width: 2; }
.logs { background: #0a0e14; }
.log { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; animation: slide .35s ease-out; }
@keyframes slide { from { transform: translateX(-20px); opacity: 0; } }
.log.sus { background: rgba(255, 77, 109, .12); animation: slide .35s ease-out, blink 1.2s ease-in-out 3; }
@keyframes blink { 50% { background: rgba(255, 77, 109, .35); } }
.log .t { color: #7c8a96; }
.log button { font: 600 11px var(--mono); padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer; }
.log button:hover { background: var(--accent); }
.mail { background: #f4f1ec; color: #1b1a1e; font-family: var(--body); }
.mail .item { padding: 10px 12px; border-bottom: 1px solid #ddd6cc; cursor: pointer; }
.mail .item:hover { background: #ebe5dc; }
.mail .item b { display: block; }
.mail .item span { color: #6b6460; font-size: 13px; }
.mail .msg { padding: 4px 2px; }
.mail .msg .from { font: 12px var(--mono); color: #6b6460; }
.mail .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.mail .btns button { font: 600 13px var(--body); padding: 8px 12px; border-radius: 8px; border: 2px solid #1b1a1e; background: #fff; cursor: pointer; }
.mail .btns button:hover { background: #1b1a1e; color: #fff; }
.daycard { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; pointer-events: none; opacity: 0; background: rgba(5,5,10,.85); }
.daycard.go { animation: daycard 2.6s ease-in-out; }
@keyframes daycard { 0% { opacity: 0; } 20%, 75% { opacity: 1; } 100% { opacity: 0; } }
.daycard div { font: 700 clamp(40px, 9vw, 96px)/1 var(--body); letter-spacing: .04em; text-align: center; }
.daycard small { display: block; font: 600 14px var(--mono); letter-spacing: .2em; opacity: .7; margin-top: 12px; }
.panel { position: fixed; z-index: 25; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: .3s cubic-bezier(.2,1.4,.4,1);
  width: min(92vw, 420px); background: #fffdf5; color: #222; border-radius: 6px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); font-family: var(--body); }
.panel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
.panel h3 { margin: 0 0 12px; }
.panel .q { display: grid; gap: 4px; padding: 10px 0; border-top: 1px dashed #ccc; font-size: 14px; }
.panel .q .m { height: 6px; border-radius: 99px; background: #eee; overflow: hidden; } .panel .q .m span { display: block; height: 100%; background: #222; }
.panel .close { margin-top: 12px; font: 600 13px var(--body); padding: 8px 14px; border-radius: 8px; border: 2px solid #222; background: #fff; cursor: pointer; }
.end { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(5,5,10,.82); backdrop-filter: blur(4px); }
.end.show { display: grid; animation: fadein .4s; }
@keyframes fadein { from { opacity: 0; } }
.end-card { width: min(92vw, 440px); padding: 26px; border-radius: 14px; background: #111018; border: 2px solid var(--accent); text-align: center; box-shadow: 0 30px 90px rgba(0,0,0,.6); animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
.end-title { font: 700 clamp(44px, 10vw, 72px)/1 var(--body); letter-spacing: .08em; color: var(--accent); text-shadow: 0 0 24px var(--accent); }
.end.lost .end-title { color: #9aa3ad; text-shadow: 2px 0 #ff2e63, -2px 0 #08f7fe; animation: glitch 1.2s steps(2) infinite; }
@keyframes glitch { 20% { transform: translate(2px, -1px); } 40% { transform: translate(-2px, 1px); } 60% { transform: none; } }
.end-card p { color: #c9c4cf; margin: 12px 0 18px; }
.end-rows { display: grid; gap: 6px; text-align: left; font: 14px var(--mono); }
.end-rows div, .end-total { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,.05); }
.end-total { margin: 12px 0 18px; font: 700 20px var(--mono); background: rgba(255,255,255,.1); }
.conf { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }
@media (max-width: 700px) {
  .win { left: 8px !important; right: 8px !important; width: auto !important; }
  .dock button { width: 50px; height: 50px; font-size: 21px; }
  .heat .meter { width: 60px; }
  .pill { padding: 7px 9px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const svg = $("#scene");
  const S = { night: false, rain: false, side: "red", day: 1, minutes: 9 * 60, heat: 0, coins: 0, inside: false, admin: false, scanned: false, stolen: false, cut: false,
    sound: false, zoomed: false, quests: { scout: 0, inside: 0, climb: 0 }, wins: [] };
  const FULL = [0, 0, 1600, 900], SCREEN = [684, 384, 272, 168], PORTRAIT = [300, 60, 1000, 820];
  let vb = FULL.slice();

  /* sound */
  let ac = null;
  function beep(f = 660, d = .06, type = "square", vol = .04) {
    if (!S.sound) return;
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol; o.connect(g); g.connect(ac.destination);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.start(); o.stop(ac.currentTime + d);
  }
  $("#sound").onclick = () => { S.sound = !S.sound; $("#sound").textContent = S.sound ? "Sound on" : "Sound off"; $("#sound").classList.toggle("on", S.sound); beep(880); };

  /* window, lights, rain, time of day */
  const lights = $("#lights");
  [[1010, 300, 60, 130], [1075, 260, 48, 170], [1128, 320, 70, 110], [1205, 240, 56, 190], [1266, 300, 64, 130], [1335, 275, 45, 155], [1385, 330, 50, 100]].forEach(([bx, by, bw, bh]) => {
    for (let y = by + 10; y < by + bh - 12; y += 18) for (let x = bx + 8; x < bx + bw - 10; x += 14) {
      if (Math.random() < .45) continue;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", 6); r.setAttribute("height", 8); r.setAttribute("class", "lit"); r.style.opacity = 0; lights.appendChild(r);
    }
  });
  const rain = $("#rain");
  for (let i = 0; i < 40; i++) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    const x = 1010 + Math.random() * 440, y = 100 + Math.random() * 300;
    l.setAttribute("x1", x); l.setAttribute("y1", y); l.setAttribute("x2", x - 6); l.setAttribute("y2", y + 22);
    l.style.animationDelay = (-Math.random()).toFixed(2) + "s"; rain.appendChild(l);
  }
  const mix = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  const SKY = [[0, "#070a1c", "#141a3a"], [5, "#070a1c", "#141a3a"], [6.2, "#3b2f6b", "#ff9a7a"], [7.5, "#7fb2ff", "#ffd7a8"],
    [16, "#7fb2ff", "#ffe4c4"], [18, "#ff8a5c", "#ffcf8a"], [19.3, "#3b2f6b", "#c46a7a"], [20.5, "#0b1030", "#1d2350"], [24, "#070a1c", "#141a3a"]];
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const [h0, t0, b0] = SKY[i], [h1, t1, b1] = SKY[i + 1];
      if (h >= h0 && h <= h1) { const k = (h - h0) / (h1 - h0); return [mix(t0, t1, k), mix(b0, b1, k)]; }
    }
    return [SKY[0][1], SKY[0][2]];
  }
  const stars = $("#stars");
  for (let i = 0; i < 40; i++) stars.insertAdjacentHTML("beforeend", `<circle cx="${1012 + Math.random() * 416}" cy="${132 + Math.random() * 150}" r="${(Math.random() * 1.4 + .4).toFixed(1)}" opacity="${(Math.random() * .6 + .4).toFixed(2)}"/>`);
  const arc = (t) => [1020 + t * 400, 420 - Math.sin(t * Math.PI) * 240];
  function paintTime() {
    const h = (S.minutes / 60) % 24;
    const [top, bottom] = skyAt(h);
    $("#sky1").setAttribute("stop-color", top); $("#sky2").setAttribute("stop-color", bottom);
    const night = h >= 20.5 || h < 5 ? 1 : h >= 18 ? (h - 18) / 2.5 : h < 7 ? 1 - (h - 5) / 2 : 0;
    const ts = (h - 6) / 14, sunUp = ts > -0.05 && ts < 1.05;
    const [sx, sy] = arc(Math.min(1, Math.max(0, ts)));
    ["#sun", "#sunglow"].forEach((id) => { $(id).setAttribute("cx", sx.toFixed(1)); $(id).setAttribute("cy", sy.toFixed(1)); $(id).style.opacity = sunUp ? "" : 0; });
    $("#sun").setAttribute("fill", h > 17 || h < 7.5 ? "#ffb070" : "#fff3c4");
    const tm = ((h - 19 + 24) % 24) / 12, moonUp = tm >= 0 && tm <= 1;
    const [mx, my] = arc(Math.min(1, tm));
    $("#moon").setAttribute("transform", `translate(${mx.toFixed(1)} ${my.toFixed(1)})`);
    $("#moon").setAttribute("opacity", moonUp ? Math.min(1, night * 1.4).toFixed(2) : 0);
    stars.setAttribute("opacity", (night * .9).toFixed(2));
    lights.querySelectorAll("rect").forEach((r, i) => { r.style.opacity = Math.min(1, night * 1.5) * (i % 3 ? 1 : .4); });
    $("#rain").setAttribute("opacity", S.rain && night > .5 ? 1 : 0);
    $("#dark").setAttribute("opacity", (night * (S.side === "red" ? .25 : .45)).toFixed(2));
    const day = Math.floor(S.minutes) % (24 * 60), mm = Math.floor(day % 60), hh = Math.floor(day / 60);
    $("#mhand").setAttribute("transform", `rotate(${(day % 60) * 6})`);
    $("#hhand").setAttribute("transform", `rotate(${(hh % 12) * 30 + (day % 60) / 2})`);
    const label = `${S.night ? "Night" : "Day"} ${S.day} · ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    $("#clockPill").textContent = label; $("#osClock").textContent = label;
  }

  /* little laptop screen in the office view */
  function paintMini() {
    const g = $("#minisc"); g.innerHTML = "";
    const lines = S.side === "red" ? ["> recon", "> exploit", "> escalate", "> exfil", "heat " + Math.round(S.heat * 100) + "%"]
      : ["09:12 login ok", "09:14 dns query", "09:15 FAILED login", "09:16 mail in", "09:17 port probe"];
    lines.concat(lines).forEach((t, i) => {
      const x = document.createElementNS("http://www.w3.org/2000/svg", "text");
      x.setAttribute("x", 694); x.setAttribute("y", 404 + i * 18); x.setAttribute("class", "code-line");
      x.setAttribute("fill", S.side === "red" ? "#3ddc84" : (t.includes("FAILED") || t.includes("probe") ? "#ff6b81" : "#9cc8ff"));
      x.setAttribute("font-family", "JetBrains Mono"); x.setAttribute("font-size", "12"); x.textContent = t; g.appendChild(x);
    });
  }
  function paintNotes() {

  S.atk = { stage: 0, ip: newIp(), next: 9 * 60 + 40, blockedUntil: 0 };
  S.blue = { blocks: 0, kicks: 0, disruption: 0, confirmed: 0 };
  S.logs = []; S.over = false;
  const clock = (m) => { const d = Math.floor(m) % 1440; return `${String(Math.floor(d / 60)).padStart(2, "0")}:${String(d % 60).padStart(2, "0")}`; };
  function addLog(entry) {
    entry.id = S.logs.length + 1; entry.time = clock(S.minutes); S.logs.unshift(entry);
    if (S.logs.length > 60) S.logs.pop();
    const box = document.querySelector(".win[data-app=logs] .body"); if (box) { box.prepend(logRow(entry)); if (box.children.length > 60) box.lastElementChild.remove(); }
    if (entry.sus) beep(300, .08, "square", .03);
  }
  function logRow(e) {
    const row = document.createElement("div"); row.className = "log" + (e.sus && !e.done ? " sus" : "");
    row.innerHTML = `<span class="t">${e.time}</span><span>${e.text}</span><span class="acts"></span>`;
    const acts = row.querySelector(".acts");
    if (e.sus && !e.done) { acts.innerHTML = `<button>investigate</button>`; acts.firstChild.onclick = () => investigate(e, row); }
    if (e.done) acts.innerHTML = `<span class="stamp ${e.real ? "bad" : "ok"}" style="font-size:12px;margin:0">${e.real ? "REAL" : "FALSE ALARM"}</span>`;
    return row;
  }
  function initLogs(w) {
    const b = w.querySelector(".body");
    if (!S.logs.length) for (let i = 0; i < 5; i++) addLog({ text: NOISE[Math.floor(Math.random() * NOISE.length)] });
    b.innerHTML = ""; S.logs.forEach((e) => b.appendChild(logRow(e)));
  }
  async function investigate(e, row) {
    if (S.night || S.over) return;
    const btn = row.querySelector(".acts button"); btn.disabled = true; btn.textContent = "checking…";
    await sleep(900); e.done = true;
    const acts = row.querySelector(".acts"); row.classList.remove("sus");
    acts.innerHTML = `<span class="stamp ${e.real ? "bad" : "ok"}" style="font-size:12px;margin:0">${e.real ? "REAL" : "FALSE ALARM"}</span>`;
    if (e.real) {
      S.blue.confirmed++; shake();
      const tools = [];
      if (STAGES[e.stage].outside) tools.push(["block", `block ${e.ip}`]);
      if (e.stage >= 1) tools.push(["isolate", "isolate web-01"]);
      row.insertAdjacentHTML("afterend", `<div class="log" style="grid-template-columns:1fr"><span>${e.ok ? "It worked: " : "It failed, but someone is trying: "}${STAGES[e.stage].name}. ${tools.map(([k, t]) => `<button data-do="${k}">${t}</button>`).join(" ")}</span></div>`);
      row.nextElementSibling.querySelectorAll("button").forEach((x) => x.onclick = () => { blueAct(x.dataset.do, e); x.parentElement.querySelectorAll("button").forEach((y) => y.disabled = true); });
      if (e.ok && e.stage >= 1) markCompromised(true);
    }
    await spend(30);
  }
  function markCompromised(on) { S.suspect = on; mapState(); }
  async function blueAct(kind, e) {
    if (kind === "block") {
      S.blue.blocks++; S.atk.blockedUntil = S.minutes + 180; S.atk.ip = newIp();
      if (S.atk.stage <= 1) S.atk.stage = 0;
      await packet(["you", "web"], "#59a8ff", false);
      toast("Blocked", `${e.ip} can no longer reach the company. They will be back with a new address.`);
    } else {
      S.cut = true; mapState(); flash();
      if (S.atk.stage >= 2) { S.atk.stage = 1; S.blue.kicks++; markCompromised(false); toast("Attacker kicked out", "web-01 is offline until tomorrow and the attacker lost their way in."); addCoins(3); }
      else { S.blue.disruption++; toast("Machine isolated", "web-01 was clean. The web shop is down until tomorrow."); }
    }
    await spend(20);
    if (S.blue.kicks >= 2) endGame(true, "You kicked the attacker out twice. They gave up.");
  }
  function attackerStep() {
    const a = S.atk;
    a.next = S.minutes + 45 + Math.random() * 60;
    if (a.blockedUntil > S.minutes) return;
    if (S.cut && a.stage >= 1 && a.stage <= 3) { a.stage = 1; }
    const st = STAGES[a.stage];
    if (S.cut && a.stage === 1) { addLog({ text: `${st.text(a.ip)} (no answer, web-01 is offline)` }); return; }
    const ok = Math.random() < st.chance;
    addLog({ text: st.text(a.ip), sus: true, real: true, stage: a.stage, ok, ip: a.ip });
    packet(st.path, "#ff4d6d", ok);
    if (ok) a.stage++;
    if (a.stage >= 4) endGame(false, "The attacker copied the customer database and left.");
  }
  function blueTick() {
    if (S.side !== "blue" || S.night || S.over) return;
    if (Math.random() < .012) addLog({ text: NOISE[Math.floor(Math.random() * NOISE.length)] });
    if (Math.random() < .0016) addLog({ text: DECOYS[Math.floor(Math.random() * DECOYS.length)], sus: true, real: false });
    if (S.minutes >= S.atk.next) attackerStep();
  }

  /* end of a game */
  function endGame(won, why) {
    if (S.over) return; S.over = true;
    const red = S.side === "red";
    const rows = red
      ? [["Got inside", S.quests.inside ? 5 : 0], ["Became admin", S.admin || S.stolen ? 5 : 0], ["Data taken", S.stolen ? 25 : 0], ["Heat left", Math.round((1 - S.heat) * 10)]]
      : [["Attacks confirmed", S.blue.confirmed * 2], ["Addresses blocked", S.blue.blocks * 2], ["Kicked out", S.blue.kicks * 8], ["Data safe", won ? 20 : 0], ["Clean machines hit", -S.blue.disruption * 3]];
    const total = rows.reduce((t, r) => t + r[1], 0);
    const end = $("#end");
    end.className = "end show " + (won ? "won" : "lost");
    end.innerHTML = `<div class="end-card"><div class="end-title">${won ? "VICTORY" : "DEFEAT"}</div><p>${why}</p>
      <div class="end-rows">${rows.map(([k, v]) => `<div><span>${k}</span><b data-v="${v}">0</b></div>`).join("")}</div>
      <div class="end-total"><span>Score</span><b id="endTotal">0</b></div>
      <button class="pill on" id="again">Play again</button></div>`;
    $("#again").onclick = () => { const u = new URL(location.href); u.search = S.side === "blue" ? "?side=blue" : ""; location.href = u.toString(); };
    beep(won ? 660 : 140, .5, won ? "triangle" : "sawtooth", .06);
    if (won) confetti(); else shake();
    const cells = [...end.querySelectorAll(".end-rows b")]; let i = 0;
    (function next() {
      if (i >= cells.length) { countUp($("#endTotal"), total); return; }
      countUp(cells[i++], +cells[i - 1].dataset.v); setTimeout(next, reduce ? 0 : 380);
    })();
  }
  function countUp(el, to) {
    const t0 = performance.now(), ms = reduce ? 1 : 500;
    (function step(now) { const t = Math.min(1, (now - t0) / ms); el.textContent = Math.round(to * t); beep(900 + t * 500, .015, "sine", .02); if (t < 1) requestAnimationFrame(step); })(t0);
  }
  function confetti() {
    if (reduce) return;
    const colors = ["#ff2e63", "#08f7fe", "#ffd27a", "#3ddc84", "#7a3fc0"];
    for (let i = 0; i < 120; i++) {
      const p = document.createElement("i"); p.className = "conf";
      p.style.left = Math.random() * 100 + "vw"; p.style.background = colors[i % colors.length];
      p.style.animationDuration = (2 + Math.random() * 2.5) + "s"; p.style.animationDelay = Math.random() * .6 + "s";
      p.style.setProperty("--dx", (Math.random() * 200 - 100) + "px"); p.style.setProperty("--r", (Math.random() * 720) + "deg");
      document.body.appendChild(p); setTimeout(() => p.remove(), 5500);
    }
  }

  /* mail */
  function initMail(w) {
    const b = w.querySelector(".body");
    if (S.side === "blue") {
      const mails = [["Invoice #2231 overdue", "billing@b-packaging.example", "Please pay today or your account will be closed. Password for the zip: 1234.", true],
        ["Lunch on Friday?", "jacob@olivebyte.example", "Pizza place again? Reply by Thursday.", false],
        ["Your mailbox is almost full", "it-support@0livebyte.example", "Click here and sign in to keep your emails.", true]];
      const list = () => { b.innerHTML = mails.map((m, i) => `<div class="item" data-i="${i}"><b>${m[0]}</b><span>${m[1]}</span></div>`).join("");
        b.querySelectorAll(".item").forEach((x) => x.onclick = () => open(+x.dataset.i)); };
      const open = (i) => { const m = mails[i];
        b.innerHTML = `<div class="msg"><div class="from">from ${m[1]}</div><h3>${m[0]}</h3><p>${m[2]}</p><div class="btns"><button data-v="1">Report phishing</button><button data-v="0">It's fine</button><button data-v="back">Back</button></div><div class="res"></div></div>`;
        b.querySelectorAll("button").forEach((x) => x.onclick = () => {
          if (x.dataset.v === "back") return list();
          const right = (x.dataset.v === "1") === m[3];
          b.querySelector(".res").innerHTML = `<span class="stamp ${right ? "ok" : "bad"}">${right ? "GOOD CALL" : "WRONG"}</span><p>${m[3] ? "Lookalike sender and pressure to act fast: classic phishing." : "A normal email from a colleague."}</p>`;
          if (!right) shake(); else flash();
        }); };
      list();
    } else {
      b.innerHTML = `<div class="msg"><div class="from">draft · to maria@olivebyte.example</div><h3>Pick a story</h3><p>Which email would Maria (finance) open?</p>
        <div class="btns"><button data-c=".5">Unpaid invoice</button><button data-c=".2">You won a prize</button><button data-c=".35">IT: reset your password</button></div><div class="res"></div></div>`;
      b.querySelectorAll("button").forEach((x) => x.onclick = async () => {
        b.querySelectorAll("button").forEach((y) => y.disabled = true);
        const res = b.querySelector(".res"); res.innerHTML = `<p>sending… chance ${Math.round(+x.dataset.c * 100)}%</p>`;
        await packet(["you", "mail"], "#ff4d6d", true);
        const ok = Math.random() < +x.dataset.c; setHeat(S.heat + .06);
        res.innerHTML += `<span class="stamp ${ok ? "ok" : "bad"}">${ok ? "CLICKED" : "IGNORED"}</span><p>${ok ? "Maria opened it. You have her account." : "She deleted it. Maybe a story that fits her job?"}</p>`;
        if (!ok) shake(); else { flash(); S.quests.inside++; paintNotes(); }
        await spend(60); setTimeout(() => initMail(w), 2600);
      });
    }
  }

  /* server rack LEDs (red room) */
  const rack = $("#rack");
  for (let r = 0; r < 8; r++) {
    const y = 20 + r * 46;
    rack.insertAdjacentHTML("beforeend", `<rect x="14" y="${y}" width="152" height="36" rx="3" fill="#1c1c24"/><rect x="24" y="${y + 14}" width="60" height="6" rx="3" fill="#2a2a33"/>`);
    for (let k = 0; k < 4; k++) {
      const c = ["#3ddc84", "#08f7fe", "#ff2e63", "#3ddc84"][(r + k) % 4];
      rack.insertAdjacentHTML("beforeend", `<circle class="led" cx="${110 + k * 14}" cy="${y + 18}" r="3.5" fill="${c}" style="animation-delay:${(Math.random() * 1.6).toFixed(2)}s;animation-duration:${(0.8 + Math.random() * 1.6).toFixed(2)}s"/>`);
    }
  }

  /* start */
  const q = new URLSearchParams(location.search);
  setSide(q.get("side") === "blue" ? "blue" : "red"); setHeat(0); fitPortrait();
  if (q.has("open")) openLaptop(q.get("open") === "now");
  if (q.has("t")) { S.minutes = +q.get("t") * 60; if (S.minutes >= 18 * 60 || S.minutes < 9 * 60) { S.night = true; S.rain = q.has("rain"); if (S.minutes < 9 * 60) S.minutes += 24 * 60; $("#skip").hidden = false; } paintTime(); }
})();
</script>
</body>
</html>
